[INPUT]
input_root=./sample/EC-Earth3/
model_name=EC-Earth3
exp_id = historical
esm_flag=r1i1p1f1
grid_flag=gr
# (Omitting cmip_strt_ts/end_ts → adapter uses glob discovery, which is
# tolerant of EC-Earth3's heterogeneous time-suffix conventions across
# variables. Previously these were required and had to match each file
# exactly, which broke whenever a new variable joined with a different
# chunking. See config.CESM2.ini for the same pattern.)
[OUTPUT]
#YYYYMMDDHHMM, please seperate your ETL processes if request very long-term simulation
etl_strt_ts =197901010000
etl_end_ts = 197901010600
output_root = ./output/
output_prefix=CMIP6-EC-EARTH3-SURF3H
